<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Fixture — Last Sign-in</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 360px;
        margin: 48px auto;
        color: #152521;
      }
      button,
      a.btn {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #d9ded8;
        background: #fff;
        text-align: center;
        text-decoration: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .primary {
        background: #166b4a;
        color: #fff;
        border-color: #166b4a;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 13px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin-top: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Welcome back</h1>
    <p>Fake login page for extension tests. No real auth.</p>

    <a class="btn" href="https://github.com/login/oauth/authorize">Continue with GitHub</a>
    <button type="button" aria-label="Continue with Google">Continue with Google</button>
    <button type="button">Continue with SSO</button>
    <button type="button">Sign in with a passkey</button>

    <p style="text-align:center;color:#61706a">or</p>

    <label>
      Email
      <input type="email" name="email" placeholder="you@example.com" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" />
    </label>
    <button class="primary" type="submit">Sign in</button>

    <button type="button">Sign out of GitHub</button>
  </body>
</html>
